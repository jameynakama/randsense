# Verb morphology the -s/-ed rules get wrong, extracted from the NLM SPECIALIST
# Lexicon. Where SPECIALIST lists several paradigms for a verb, a regular one
# wins over an irregular one (dreamed, not dreamt). A doubled one wins over a
# regular one (referred), except after -l or -s, where US spelling keeps one
# consonant (traveled). "be" is handled in code.

