# Weighted grammar for sentence generation. Weights are relative among a
# symbol's rules and default to 1. Terminals are the POS names in
# grammar.POS (Noun, Verb, Determiner, ..., Comma for punctuation, and
# Complementizer and To, which are "that" and "to"); any other symbol needs
# rules. Verb and Conjunction slots can be qualified (see
# grammar.qualifiers): "Verb:transitive" requires that frame, and
# "Conjunction:np" an and/or that can join noun phrases, while
# "Conjunction:neither" and "Conjunction:nor" are those words. A
# fixed-preposition frame ("Verb:transitive-with") needs its preposition
# spelled out, and
# "Preposition:with" is always "with", as "Complementizer:whether" is
# "whether" and "Pronoun:it" is "it". "Pronoun:genitive" takes a genitive
# pronoun ("mine"). Unqualified slots take any word.
#
# Agreement depends on four symbol names, NP, VP, InfVP and GerVP: an NP
# followed by a VP among its siblings is the subject (nominative pronouns, and
# the VP's verbs agree with it). An NP's person and number come from its
# Pronoun, its Determiner, or "NP Conjunction NP" coordination. Verbs under an
# InfVP keep their base form and verbs under a GerVP take -ing, up to any
# clause nested inside them.

[[rule]]
symbol = "S"
expansion = ["Clause"]
weight = 6

[[rule]]
symbol = "S"
expansion = ["Clause", "Comma", "Conjunction:coordinating", "Clause"]

[[rule]]
symbol = "S"
expansion = ["Clause", "Conjunction:subordinating", "Clause"]

[[rule]]
symbol = "Clause"
expansion = ["NP", "VP"]

[[rule]]
symbol = "Clause"
expansion = ["Pronoun:it", "Verb:weather"]
weight = 0.04

[[rule]]
symbol = "Clause"
expansion = ["Pronoun:it", "Verb:dummy-that-clause", "Complementizer", "Clause"]
weight = 0.04

[[rule]]
symbol = "NP"
expansion = ["Determiner", "ADJ", "Noun"]
weight = 0.5

[[rule]]
symbol = "NP"
expansion = ["Determiner", "Noun"]
weight = 0.5

[[rule]]
symbol = "NP"
expansion = ["Pronoun"]
weight = 0.25

[[rule]]
symbol = "NP"
expansion = ["Pronoun:genitive"]
weight = 0.05

[[rule]]
symbol = "NP"
expansion = ["NP", "Conjunction:np", "NP"]
weight = 0.1

[[rule]]
symbol = "NP"
expansion = ["Conjunction:neither", "NP", "Conjunction:nor", "NP"]
weight = 0.03

[[rule]]
symbol = "VP"
expansion = ["Verb:transitive", "NP"]
weight = 4

[[rule]]
symbol = "VP"
expansion = ["Verb:intransitive"]
weight = 2

[[rule]]
symbol = "VP"
expansion = ["Verb:intransitive-pp", "PP"]

[[rule]]
symbol = "VP"
expansion = ["Verb:transitive-pp", "NP", "PP"]

[[rule]]
symbol = "VP"
expansion = ["Verb:ditransitive", "NP", "NP"]
weight = 0.5

[[rule]]
symbol = "VP"
expansion = ["Verb:intransitive-on", "Preposition:on", "NP"]
weight = 0.25

[[rule]]
symbol = "VP"
expansion = ["Verb:intransitive-to", "Preposition:to", "NP"]
weight = 0.25

[[rule]]
symbol = "VP"
expansion = ["Verb:transitive-from", "NP", "Preposition:from", "NP"]
weight = 0.25

[[rule]]
symbol = "VP"
expansion = ["Verb:transitive-of", "NP", "Preposition:of", "NP"]
weight = 0.25

[[rule]]
symbol = "VP"
expansion = ["Verb:transitive-on", "NP", "Preposition:on", "NP"]
weight = 0.25

[[rule]]
symbol = "VP"
expansion = ["Verb:transitive-to", "NP", "Preposition:to", "NP"]
weight = 0.25

[[rule]]
symbol = "VP"
expansion = ["Verb:transitive-with", "NP", "Preposition:with", "NP"]
weight = 0.25

[[rule]]
symbol = "VP"
expansion = ["Verb:that-clause", "Complementizer", "Clause"]
weight = 0.35

[[rule]]
symbol = "VP"
expansion = ["Verb:that-clause", "Clause"]
weight = 0.15

[[rule]]
symbol = "VP"
expansion = ["Verb:to-infinitive", "InfVP"]
weight = 0.35

[[rule]]
symbol = "VP"
expansion = ["Verb:transitive-to-infinitive", "NP", "InfVP"]
weight = 0.25

[[rule]]
symbol = "VP"
expansion = ["Verb:whether-infinitive", "Complementizer:whether", "InfVP"]
weight = 0.15

[[rule]]
symbol = "VP"
expansion = ["Verb:gerund", "GerVP"]
weight = 0.25

[[rule]]
symbol = "VP"
expansion = ["Verb:transitive-into-gerund", "NP", "Preposition:into", "GerVP"]
weight = 0.15

[[rule]]
symbol = "VP"
expansion = ["Verb:adjective", "Adjective"]
weight = 0.4

[[rule]]
symbol = "VP"
expansion = ["Verb:transitive-adjective", "NP", "Adjective"]
weight = 0.2

[[rule]]
symbol = "VP"
expansion = ["VP", "Adverb"]

[[rule]]
symbol = "VP"
expansion = ["Adverb", "VP"]
weight = 0.5

[[rule]]
symbol = "InfVP"
expansion = ["To", "VP"]

[[rule]]
symbol = "GerVP"
expansion = ["VP"]

[[rule]]
symbol = "PP"
expansion = ["Preposition", "NP"]

[[rule]]
symbol = "ADJ"
expansion = ["Adjective"]
weight = 3

[[rule]]
symbol = "ADJ"
expansion = ["ADJ", "Adjective"]
