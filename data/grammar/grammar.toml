# Weighted grammar for sentence generation. Weights are relative among a
# symbol's rules and default to 1. Terminals are the POS names in
# grammar.POS (Noun, Verb, Determiner, ..., and Comma for punctuation); any
# other symbol needs rules. Verb and Conjunction slots can be qualified (see
# grammar.qualifiers): "Verb:transitive" requires that frame, and
# "Conjunction:np" an and/or that can join noun phrases. Unqualified slots
# take any word.
#
# Agreement depends on two symbol names, NP and VP: an NP followed by a VP
# among its siblings is the subject (nominative pronouns, and the VP's verbs
# agree with it). An NP's person and number come from its Pronoun, its
# Determiner, or "NP Conjunction NP" coordination.

[[rule]]
symbol = "S"
expansion = ["Clause"]
weight = 6

[[rule]]
symbol = "S"
expansion = ["Clause", "Comma", "Conjunction:coordinating", "Clause"]

[[rule]]
symbol = "S"
expansion = ["Clause", "Conjunction:subordinating", "Clause"]

[[rule]]
symbol = "Clause"
expansion = ["NP", "VP"]

[[rule]]
symbol = "NP"
expansion = ["Determiner", "ADJ", "Noun"]
weight = 0.5

[[rule]]
symbol = "NP"
expansion = ["Determiner", "Noun"]
weight = 0.5

[[rule]]
symbol = "NP"
expansion = ["Pronoun"]
weight = 0.25

[[rule]]
symbol = "NP"
expansion = ["NP", "Conjunction:np", "NP"]
weight = 0.1

[[rule]]
symbol = "VP"
expansion = ["Verb:transitive", "NP"]
weight = 4

[[rule]]
symbol = "VP"
expansion = ["Verb:intransitive"]
weight = 2

[[rule]]
symbol = "VP"
expansion = ["Verb:intransitive-pp", "PP"]

[[rule]]
symbol = "VP"
expansion = ["Verb:transitive-pp", "NP", "PP"]

[[rule]]
symbol = "VP"
expansion = ["Verb:ditransitive", "NP", "NP"]
weight = 0.5

[[rule]]
symbol = "VP"
expansion = ["VP", "Adverb"]

[[rule]]
symbol = "VP"
expansion = ["Adverb", "VP"]
weight = 0.5

[[rule]]
symbol = "PP"
expansion = ["Preposition", "NP"]

[[rule]]
symbol = "ADJ"
expansion = ["Adjective"]
weight = 3

[[rule]]
symbol = "ADJ"
expansion = ["ADJ", "Adjective"]
